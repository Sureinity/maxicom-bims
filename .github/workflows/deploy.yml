---
name: Deploy to Server

# on:
#   workflow_run:
#     workflows: [Continuous Integration]
#     branches:
#       - main
#     types:
#       - completed

# on:
#   workflow_dispatch:
   
on:
  push:
    branches:
      - test/cicd

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build Docker Image with ARM Architecture and Push to GHCR 
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Setup QEMU
        uses: docker/setup-qemu-action@v4.0.0

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Build and push Docker images
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          platforms: linux/arm/v7
          push: True
          # tags: ${{ env.REGISTRY }}/${{ github.repository }}/armv7
          tags: ${{ env.REGISTRY }}/sureinity/maxicom-bims:armv7

  pull-from-server:
    name: Command server to pull and run Docker Image
    runs-on: ubuntu-latest
 #   needs: build-and-push
    environment: staging
    steps:
      - name: Setup Tailscale on Runner
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-runner

      - name: Test SSH Connection to Server
        run: |
          ssh -oStrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.TS_SERVER_HOST }} "hostname && whoami"


